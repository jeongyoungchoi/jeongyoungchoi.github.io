<header>
    <div class="header-controls">
        <div class="lang-dropdown">
        <button class="lang-dropbtn">Language ▼</button>
            <div class="lang-dropdown-content">
                {%- capture subpage -%}
                    {{- page.url | remove_first: '/en' | remove_first: '/ko' -}}
                {%- endcapture -%}
                <a href="/en{{ subpage }}">English</a>
                <a href="/ko{{ subpage }}">한국어</a>
            </div>
        </div>
        <button id="mode-toggle" aria-label="Toggle dark/light mode">🌙</button>
    </div>
    
    <h1><a href="{{ site.baseurl }}/{{ page.lang }}/" aria-label="Jeong Young Choi">Jeong Young Choi</a></h1>
    
    <nav>
        {% if page.lang == "en" %}
            <a href="/en/about">About</a>
            <a href="/en/projects">Projects</a>
            <a href="/en/research">Research</a>
            <a href="/en/contact">Contact</a>
        {% elsif page.lang == "ko" %}
            <a href="/ko/about">소개</a>
            <a href="/ko/projects">프로젝트</a>
            <a href="/ko/research">연구</a>
            <a href="/ko/contact">연락처</a>
        {% endif %}
    </nav>
</header>
