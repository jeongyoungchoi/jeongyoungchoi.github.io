<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최정영 | 열전지</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/style.css">
    <script>
        (function () {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.classList.add(savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.add('light-mode');
            }
        })();
        // Simple password gate (not secure, just keeps the page out of casual view)
        (function () {
            var ok = false;
            try { ok = sessionStorage.getItem('tb-unlocked') === '1'; } catch (e) {}
            if (!ok) document.documentElement.classList.add('tb-locked');
        })();
    </script>
    <style>
        /* Password gate */
        .tb-gate { display: none; }
        html.tb-locked body > *:not(.tb-gate) { display: none !important; }
        html.tb-locked .tb-gate {
            display: flex;
            min-height: 100svh;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .tb-gate form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            max-width: 20rem;
            padding: 1.6rem;
            border-radius: var(--radius-md);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 6px 18px -10px var(--shadow);
            text-align: center;
        }
        .tb-gate input, .tb-gate button {
            font: inherit;
            padding: 0.55rem 0.8rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            background: transparent;
            color: inherit;
        }
        .tb-gate button { cursor: pointer; border-color: var(--accent); color: var(--accent); }
        .tb-gate .tb-gate-err { margin: 0; min-height: 1.2em; font-size: 0.85rem; color: var(--text-sub); }

        /* Page-specific styles for the hidden coin cell page */
        main.tb-main {
            max-width: 1200px;
            padding-bottom: 0;
        }

        .tb-hero {
            min-height: calc(70svh - var(--tb-header, 120px));
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .tb-hero h2 { margin: 0 0 0.6rem; font-size: clamp(1.7rem, 1.2rem + 2.2vw, 2.8rem); }
        .tb-hero p { margin: 0 auto; max-width: 36rem; color: var(--text-sub); }
        .tb-scroll-hint {
            margin-top: 2.2rem;
            font-size: 0.85rem;
            color: var(--text-sub);
            letter-spacing: 0.08em;
        }
        .tb-scroll-hint span {
            display: block;
            margin: 0.5rem auto 0;
            width: 1px;
            height: 38px;
            background: linear-gradient(var(--accent), transparent);
            animation: tb-hint 1.8s var(--ease) infinite;
            transform-origin: top;
        }
        @keyframes tb-hint {
            0% { transform: scaleY(0); opacity: 1; }
            70% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(1); opacity: 0; }
        }

        /* Scroll-driven exploded view: the section is tall, the stage sticks */
        .tb-scrolly {
            position: relative;
            height: 420vh;
        }
        .tb-stage {
            position: sticky;
            top: var(--tb-header, 120px);
            height: calc(100svh - var(--tb-header, 120px));
            overflow: hidden;
        }
        .tb-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #tb-leaders { pointer-events: none; }
        #tb-leaders line {
            stroke: var(--accent);
            stroke-width: 1.2;
            opacity: 0;
            transition: opacity 300ms var(--ease);
        }
        #tb-leaders circle {
            fill: var(--accent);
            opacity: 0;
            transition: opacity 300ms var(--ease);
        }
        #tb-leaders .is-on { opacity: 1; }

        .tb-label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 0.35rem 0.7rem;
            border-radius: var(--radius-md);
            background: color-mix(in srgb, var(--card-bg) 88%, transparent);
            border: 1px solid var(--card-border);
            box-shadow: 0 6px 18px -10px var(--shadow);
            line-height: 1.3;
            opacity: 0;
            transition: opacity 300ms var(--ease), translate 300ms var(--ease);
            translate: 8px 0;
            will-change: transform;
        }
        .tb-label.side-left { translate: -8px 0; text-align: right; }
        .tb-label.is-on { opacity: 1; translate: 0 0; }
        .tb-label.is-hover {
            border-color: var(--accent);
            box-shadow: 0 8px 22px -10px var(--glow-1);
        }
        .tb-label .tb-num {
            color: var(--accent);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            margin-right: 0.35rem;
        }
        .tb-label .tb-name { font-weight: 600; font-size: 0.98rem; }
        .tb-label .tb-en { display: block; font-size: 0.78rem; color: var(--text-sub); }

        .tb-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 1.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-sub);
            pointer-events: none;
            transition: opacity 300ms var(--ease);
        }

        /* Hover: parts grow slightly around their own centre (--cy set in tb.js) */
        .tb-part-inner {
            transform: translate(0, var(--cy)) scale(1) translate(0, calc(-1 * var(--cy)));
            transition: transform 260ms var(--ease);
        }
        .is-hover > .tb-part-inner {
            transform: translate(0, var(--cy)) scale(1.07) translate(0, calc(-1 * var(--cy)));
        }

        /* Hash links (#coin-cell, ...) land below the sticky header */
        main > section[id] { scroll-margin-top: var(--tb-header, 120px); }

        .tb-fallback { padding: 2rem 0; text-align: center; color: var(--text-sub); }

        @media (max-width: 759px) {
            .tb-scrolly { height: 360vh; }
            .tb-label { padding: 0.25rem 0.5rem; }
            .tb-label .tb-name { font-size: 0.85rem; }
            .tb-label .tb-en { font-size: 0.7rem; }
            .tb-caption { font-size: 0.8rem; bottom: 0.8rem; }
        }

        /* Sections that follow the exploded view (graphs go here later) */
        .tb-section { padding: 4rem 0; }
    </style>
</head>
<body>
    <div class="tb-gate">
        <form id="tb-gate-form" autocomplete="off">
            <label for="tb-gate-pw">비밀번호를 입력하세요</label>
            <input type="password" id="tb-gate-pw" autofocus>
            <button type="submit">확인</button>
            <p class="tb-gate-err" id="tb-gate-err" aria-live="polite"></p>
        </form>
    </div>
    <script>
        document.getElementById('tb-gate-form').addEventListener('submit', function (e) {
            e.preventDefault();
            if (document.getElementById('tb-gate-pw').value === 'iifa') {
                try { sessionStorage.setItem('tb-unlocked', '1'); } catch (err) {}
                location.reload();
            } else {
                document.getElementById('tb-gate-err').textContent = '비밀번호가 올바르지 않습니다.';
            }
        });
    </script>
    <header>
        <div class="header-controls">
            <div class="lang-dropdown">
                <button class="lang-dropbtn">Language ▼</button>
                <div class="lang-dropdown-content">
                    <a href="/en/">English</a>
                    <a href="/ko/">한국어</a>
                </div>
            </div>
            <button id="mode-toggle" aria-label="Toggle dark/light mode" aria-pressed="false"><svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg><svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
        </div>

        <h1><a href="/ko/" aria-label="Jeong Young Choi">Jeong Young Choi</a></h1>

        <nav>
            <a href="/ko/about.html">소개</a>
            <a href="/ko/projects.html">프로젝트</a>
            <a href="/ko/research.html">연구</a>
            <a href="/ko/contact.html">연락처</a>
        </nav>
    </header>
    <main class="tb-main">
        <section class="tb-hero">
            <h2 id="coin-cell">코인 셀의 구조</h2>
            <p>스크롤하시면 코인 셀이 분해되며 각 구성 요소를 확인할 수 있습니다.</p>
            <div class="tb-scroll-hint" aria-hidden="true">SCROLL<span></span></div>
        </section>

        <section class="tb-scrolly" id="coin-cell">
            <div class="tb-stage" id="tb-stage">
                <svg id="tb-leaders" aria-hidden="true"></svg>
                <div class="tb-caption" id="tb-caption">조립된 코인 셀</div>
            </div>
        </section>

        <!-- Graph sections go here. Give each one class="tb-section" and an id; the id
             shows up in the URL while it is on screen, e.g.
             <section class="tb-section" id="electrochemistry-rt"> ... </section>
             For scroll-driven animation, register it in assets/js/tb.js (see "Scenes"). -->
    </main>
    <footer>
        <div class="socials-container">
            <div class="socials">
                <a href="https://linkedin.com/in/jeongyoungchoi" target="_blank" rel="noopener" aria-label="LinkedIn">
                    <img class="light-icon" src="/assets/images/icons/LI-In-Bug.png" alt="LinkedIn logo light mode"/>
                    <img class="dark-icon" src="/assets/images/icons/InBug-White.png" alt="LinkedIn logo dark mode"/>
                </a>
            </div>
            <div class="socials">
                <a href="https://scholar.google.com/citations?user=NcIF9NEAAAAJ&hl=en" target="_blank" rel="noopener" aria-label="Google Scholar">
                    <img class="light-icon" src="/assets/images/icons/Google_Scholar_logo.svg" alt="Google Scholar logo light mode"/>
                    <img class="dark-icon" src="/assets/images/icons/Google_Scholar_logo.svg" alt="Google Scholar logo dark mode"/>
                </a>
            </div>
        </div>
        <p>&copy; 2026 Jeong Young Choi</p>
    </footer>
    <script src="/assets/js/main.js" defer></script>
    <script src="/assets/js/tb.js" defer></script>
</body>
</html>
